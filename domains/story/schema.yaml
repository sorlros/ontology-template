# 소설 도메인 규칙. 사건 종류마다 "본문에 이 말이 나오면 이 사건이 있었을 수 있다"는 단어 목록을 둔다.
# 단어 목록은 변화 후보를 고르는 데만 쓴다. 상태를 바꾸는 것은 선언된 사건뿐이다.
events:
  act:    {label: 행동, triggers: []}
  move:   {label: 이동, triggers: [향했, 떠났, 도착, 달아났, 돌아왔]}
  die:    {label: 사망, triggers: [숨을 거두, 죽었, 죽였, 사망, 목숨을 잃]}
  give:   {label: 전달, triggers: [건넸, 넘겨주, 빼앗]}
  relate: {label: 관계 변화, triggers: [배신, 동맹을 맺, 화해, 등을 돌]}
  mark:   {label: 사실 성립, triggers: []}
relations: [동맹, 적대, 연인, 남남]
# 관계가 이 값으로 바뀌면 관계를 잃은 것으로 본다(결말의 대가 검사).
loss_relations: [적대, 남남]
# 사망자의 이름이 이 말과 같은 문장에 나오면 회상으로 보고 넘어간다.
recall: [떠올, 기억, 회상, 무덤, 꿈]
